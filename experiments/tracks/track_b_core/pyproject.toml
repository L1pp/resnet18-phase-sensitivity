[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trackb-unified-r1"
version = "0.1.0"
description = "Exploratory Track B scientific runtime"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.scripts]
trackb = "fsx.cli:main"

[tool.setuptools]
packages = ["fsx"]
