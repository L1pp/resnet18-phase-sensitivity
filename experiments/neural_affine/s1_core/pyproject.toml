[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-affine-s1-clean"
version = "0.1.0"
description = "Clean minimal reproduction for the S1 Neural Affine experiment"
requires-python = ">=3.11"
dependencies = ["numpy", "Pillow", "torch", "torchvision"]

[project.scripts]
s1clean = "s1clean.cli:main"

[tool.setuptools]
packages = ["s1clean"]

